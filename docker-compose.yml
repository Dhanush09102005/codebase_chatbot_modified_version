version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: code_qa_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: code_qa_frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
